<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <circle cx="60" cy="60" r="56" fill="#FFFFFF" stroke="#002D85" stroke-width="2.5"/>
  <defs>
    <path id="gbTop" d="M 18,62 A 42,42 0 1,1 102,62" />
    <path id="gbBot" d="M 24,74 A 40,40 0 0,0 96,74" />
  </defs>
  <text fill="#002D85" font-family="sans-serif" font-size="8.2" font-weight="800" letter-spacing="0.8">
    <textPath href="#gbTop" startOffset="50%" text-anchor="middle">KYUNGBOCK HIGH SCHOOL</textPath>
  </text>
  <!-- Left & Right laurel arcs -->
  <g fill="none" stroke="#002D85" stroke-width="2.2" stroke-linecap="round">
    <path d="M 18 62 C 18 82, 29 96, 45 102"/>
    <path d="M 102 62 C 102 82, 91 96, 75 102"/>
  </g>
  <g fill="#002D85">
    <ellipse cx="16" cy="66" rx="3.2" ry="1.6" transform="rotate(-25 16 66)"/>
    <ellipse cx="19" cy="75" rx="3.2" ry="1.6" transform="rotate(-10 19 75)"/>
    <ellipse cx="24" cy="84" rx="3.2" ry="1.6" transform="rotate(15 24 84)"/>
    <ellipse cx="31" cy="92" rx="3.2" ry="1.6" transform="rotate(30 31 92)"/>
    <ellipse cx="104" cy="66" rx="3.2" ry="1.6" transform="rotate(25 104 66)"/>
    <ellipse cx="101" cy="75" rx="3.2" ry="1.6" transform="rotate(10 101 75)"/>
    <ellipse cx="96" cy="84" rx="3.2" ry="1.6" transform="rotate(-15 96 84)"/>
    <ellipse cx="89" cy="92" rx="3.2" ry="1.6" transform="rotate(-30 89 92)"/>
  </g>
  <!-- Twin horizontal bars (=) flanking center 福 -->
  <g fill="#002D85">
    <rect x="24" y="55" width="11" height="3.2" rx="1"/>
    <rect x="24" y="62" width="11" height="3.2" rx="1"/>
    <rect x="85" y="55" width="11" height="3.2" rx="1"/>
    <rect x="85" y="62" width="11" height="3.2" rx="1"/>
  </g>
  <!-- Bold geometric 福 (Gyeongbok emblem center) -->
  <text x="60" y="73" text-anchor="middle" fill="#002D85" font-family="serif" font-size="40" font-weight="900">福</text>
  <text x="60" y="93" text-anchor="middle" fill="#002D85" font-family="sans-serif" font-size="10.5" font-weight="900" letter-spacing="1">1921</text>
  <text x="60" y="106" text-anchor="middle" fill="#002D85" font-family="serif" font-size="8.5" font-weight="800" letter-spacing="1.2">景福高等學校</text>
